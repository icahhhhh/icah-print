<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icah Print — Kasir</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EC; --card:#FFFFFF; --ink-900:#17181C; --ink-600:#5B5D66;
    --press:#21409A; --press-dark:#162C6E; --press-50:#EAEEF9;
    --stamp-red:#C1272D; --stamp-red-50:#FBEAEA;
    --ok-green:#1E7A46; --ok-50:#E7F3EC; --line:#DEDAD0; --gold:#E2A33B;
  }
  *{box-sizing:border-box}
  body{background:var(--paper); font-family:'IBM Plex Sans',sans-serif; color:var(--ink-900); margin:0;}
  .font-display{font-family:'Big Shoulders Display',sans-serif; font-weight:900;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .dashed-x{background-image:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 16px); height:2px;}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#D3CDBE;border-radius:4px}
  input,select{outline:none}
  input:focus,select:focus{box-shadow:0 0 0 3px var(--press-50); border-color:var(--press) !important;}
  .tab-btn{position:relative}
  .tab-btn.active{color:#fff}
  .tab-btn.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-13px;height:3px;background:var(--gold);}
  .receipt-edge{border-bottom:2px dashed var(--line);}
  .qstep-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700;line-height:1;cursor:pointer;user-select:none;}
  .qstep-btn:hover{background:var(--press-50);border-color:var(--press);}
  .prod-card{transition:box-shadow .15s, transform .15s;}
  .prod-card:hover{box-shadow:0 4px 14px rgba(23,24,28,.08); transform:translateY(-1px);}
  .modal-bg{background:rgba(23,24,28,.55);}
  @media print{
    body.printing-invoice *{visibility:hidden;}
    body.printing-invoice #invoice-print-area, body.printing-invoice #invoice-print-area *{visibility:visible;}
    body.printing-invoice #invoice-print-area{position:absolute;left:0;top:0;width:320px;}
    .no-print{display:none !important;}
  }
  .spin{animation:spin 1.1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-in{animation:fadeIn .18s ease-out;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================
   ICAH PRINT — APLIKASI KASIR
   Backend data: Google Spreadsheet (via Google Apps Script Web App)
   ========================================================= */

/* ---------- Registration-mark icon (signature motif) ---------- */
function regMark(size, color, spin){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" class="${spin?'spin':''}" style="flex:none">
    <circle cx="20" cy="20" r="13" fill="none" stroke="${color}" stroke-width="2.4"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="${color}" stroke-width="2.4"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="${color}" stroke-width="2.4"/>
    <circle cx="20" cy="20" r="2.6" fill="${color}"/>
  </svg>`;
}
function logoMark(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 172 148">
    <g opacity="0.55">
      <path d="M80 18 C118 66 132 96 132 122 A52 52 0 1 1 28 122 C28 96 42 66 80 18 Z" fill="#17A6C7" transform="translate(-5,4)"/>
      <path d="M80 18 C118 66 132 96 132 122 A52 52 0 1 1 28 122 C28 96 42 66 80 18 Z" fill="#D6336C" transform="translate(5,-3)"/>
    </g>
    <path d="M80 18 C118 66 132 96 132 122 A52 52 0 1 1 28 122 C28 96 42 66 80 18 Z" fill="#F3F1EC"/>
    <g transform="translate(102,78)" stroke="#21409A" stroke-width="2.2" fill="none">
      <circle r="11"/><line x1="-17" y1="0" x2="17" y2="0"/><line x1="0" y1="-17" x2="0" y2="17"/>
      <circle r="2.2" fill="#21409A" stroke="none"/>
    </g>
  </svg>`;
}

/* ---------- storage helper: window.storage (artifact) -> localStorage (standalone) ---------- */
const store = {
  async get(key){
    try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
    try{ if(typeof localStorage!=='undefined') return localStorage.getItem(key); }catch(e){}
    return null;
  },
  async set(key,value){
    try{ if(window.storage){ await window.storage.set(key,value); return; } }catch(e){}
    try{ if(typeof localStorage!=='undefined') localStorage.setItem(key,value); }catch(e){}
  }
};

/* ---------- state ---------- */
const state = {
  view: 'kasir',
  settings: { webAppUrl:'', storeName:'Icah Print', address:'', cashier:'Kasir', footer:'Terima kasih telah mempercayakan cetakan Anda ke Icah Print' },
  products: [],
  cart: [],
  category: 'Semua',
  search: '',
  discountRp: 0,
  metode: 'Tunai',
  bayar: 0,
  editingKode: null,
  syncStatus: 'offline', // offline | ok | error | syncing
  lastInvoice: null,
  transactions: [],
};

const DEFAULT_PRODUCTS = [
  {kode:'PC001', nama:'Fotocopy A4', kategori:'Fotocopy', harga:300, satuan:'lembar'},
  {kode:'PC002', nama:'Print Warna A4', kategori:'Print Dokumen', harga:2000, satuan:'lembar'},
  {kode:'PC003', nama:'Print Hitam Putih A4', kategori:'Print Dokumen', harga:500, satuan:'lembar'},
  {kode:'PC004', nama:'Cetak Foto 4R', kategori:'Cetak Foto', harga:3000, satuan:'lembar'},
  {kode:'PC005', nama:'Banner Flexi', kategori:'Banner & Spanduk', harga:25000, satuan:'meter'},
  {kode:'PC006', nama:'Stiker Vinyl', kategori:'Stiker & Label', harga:35000, satuan:'meter'},
  {kode:'PC007', nama:'Jilid Spiral', kategori:'Jilid & Laminating', harga:8000, satuan:'buah'},
  {kode:'PC008', nama:'Laminating A4', kategori:'Jilid & Laminating', harga:5000, satuan:'lembar'},
  {kode:'PC009', nama:'Cetak ID Card', kategori:'ID Card', harga:15000, satuan:'pcs'},
  {kode:'PC010', nama:'Cetak Undangan', kategori:'Undangan', harga:3500, satuan:'lembar'},
];
const KATEGORI_SARAN = ['Fotocopy','Print Dokumen','Cetak Foto','Banner & Spanduk','Stiker & Label','ID Card','Undangan','Jilid & Laminating','ATK','Lainnya'];

/* ---------- utils ---------- */
function rupiah(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID'); }
function uid(){ return Math.random().toString(36).slice(2,8); }
function todayLabel(){ return new Date().toLocaleString('id-ID',{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
async function nextInvoiceNo(){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  let counter = Number(await store.get('icahprint:counter:'+ymd)) || 0;
  counter += 1;
  await store.set('icahprint:counter:'+ymd, String(counter));
  return `ICP-${ymd}-${String(counter).padStart(4,'0')}`;
}

/* ---------- API (Google Apps Script) ---------- */
async function apiGet(action, params={}){
  if(!state.settings.webAppUrl) throw new Error('URL Web App belum diatur');
  const url = new URL(state.settings.webAppUrl);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  const json = await res.json();
  if(!json.success) throw new Error(json.error||'Gagal mengambil data');
  return json.data;
}
async function apiPost(action, data={}){
  if(!state.settings.webAppUrl) throw new Error('URL Web App belum diatur');
  const res = await fetch(state.settings.webAppUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify({ action, data })
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error||'Gagal menyimpan data');
  return json;
}

async function syncProductsFromSheet(silent){
  if(!state.settings.webAppUrl) return;
  state.syncStatus = 'syncing'; if(!silent) render();
  try{
    const data = await apiGet('getProducts');
    if(Array.isArray(data) && data.length){ state.products = data; await store.set('icahprint:products', JSON.stringify(data)); }
    state.syncStatus = 'ok';
  }catch(e){ state.syncStatus = 'error'; }
  render();
}

/* ---------- init ---------- */
async function init(){
  try{ const s = await store.get('icahprint:settings'); if(s) state.settings = {...state.settings, ...JSON.parse(s)}; }catch(e){}
  try{ const p = await store.get('icahprint:products'); if(p) state.products = JSON.parse(p); }catch(e){}
  if(!state.products || !state.products.length) state.products = DEFAULT_PRODUCTS;
  render();
  if(state.settings.webAppUrl) syncProductsFromSheet(true);
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${Header()}
    <main class="max-w-7xl mx-auto px-3 md:px-4 pb-24">
      ${ state.view==='kasir' ? ViewKasir() : '' }
      ${ state.view==='barang' ? ViewBarang() : '' }
      ${ state.view==='riwayat' ? ViewRiwayat() : '' }
      ${ state.view==='pengaturan' ? ViewPengaturan() : '' }
    </main>
    ${ state.lastInvoice ? InvoiceModal() : '' }
  `;
  document.body.classList.toggle('printing-invoice', !!state.lastInvoice);
  bindEvents();
}

function Header(){
  const dot = { ok:'#3DBA6A', error:'#C1272D', syncing:'#E2A33B', offline:'#9CA3AF' }[state.syncStatus];
  const label = { ok:'Tersambung ke Spreadsheet', error:'Gagal sinkron', syncing:'Menyinkronkan…', offline:'Mode lokal (belum tersambung)' }[state.syncStatus];
  const tabs = [['kasir','Kasir'],['barang','Data Barang'],['riwayat','Riwayat'],['pengaturan','Pengaturan']];
  return `
  <header class="sticky top-0 z-30 no-print" style="background:var(--press-dark)">
    <div class="max-w-7xl mx-auto px-3 md:px-4 py-2.5 flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2.5">
        ${logoMark(38)}
        <div class="leading-none">
          <div class="font-display text-white text-xl tracking-tight">ICAH PRINT</div>
          <div class="text-[9px] tracking-[0.28em] text-white/55 mt-0.5">SISTEM KASIR</div>
        </div>
      </div>
      <nav class="flex items-center gap-1 bg-white/10 rounded-lg p-1">
        ${tabs.map(([k,l])=>`<button data-tab="${k}" class="tab-btn ${state.view===k?'active':''} px-3 py-1.5 rounded-md text-sm font-medium ${state.view===k?'bg-white/15 text-white':'text-white/60 hover:text-white/90'}">${l}</button>`).join('')}
      </nav>
      <div class="flex items-center gap-1.5 text-[11px] text-white/70">
        <span style="width:7px;height:7px;border-radius:99px;background:${dot};display:inline-block"></span>${label}
      </div>
    </div>
  </header>`;
}

/* ---------- KASIR ---------- */
function ViewKasir(){
  const categories = ['Semua', ...new Set(state.products.map(p=>p.kategori).filter(Boolean))];
  const filtered = state.products.filter(p=>{
    const okCat = state.category==='Semua' || p.kategori===state.category;
    const okSearch = !state.search || (p.nama||'').toLowerCase().includes(state.search.toLowerCase()) || (p.kode||'').toLowerCase().includes(state.search.toLowerCase());
    return okCat && okSearch;
  });

  const subtotal = state.cart.reduce((s,i)=>s+i.harga*i.qty,0);
  const total = Math.max(subtotal - (Number(state.discountRp)||0), 0);
  const kembalian = state.metode==='Tunai' ? Math.max((Number(state.bayar)||0) - total, 0) : 0;
  const bisaBayar = state.metode!=='Tunai' || (Number(state.bayar)||0) >= total;

  return `
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 pt-4">
    <div class="lg:col-span-2">
      <div class="flex flex-col sm:flex-row gap-2 mb-3">
        <input id="search-input" value="${state.search}" placeholder="Cari nama atau kode barang…" class="flex-1 bg-white border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
      </div>
      <div class="flex gap-2 overflow-x-auto pb-2 mb-3">
        ${categories.map(c=>`<button data-cat="${c}" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border ${state.category===c?'text-white':'bg-white'}" style="${state.category===c?'background:var(--press);border-color:var(--press)':'border-color:var(--line);color:var(--ink-600)'}">${c}</button>`).join('')}
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
        ${filtered.length? filtered.map(ProductCard).join('') : `<div class="col-span-full text-center py-16 text-sm" style="color:var(--ink-600)">Barang tidak ditemukan. Tambahkan di tab <b>Data Barang</b>.</div>`}
      </div>
    </div>

    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm border sticky top-20 overflow-hidden" style="border-color:var(--line)">
        <div class="px-4 pt-4 pb-3 text-center receipt-edge">
          <div class="font-display text-lg">${state.settings.storeName.toUpperCase()}</div>
          <div class="text-[11px]" style="color:var(--ink-600)">${state.settings.address||'Nota Penjualan'}</div>
        </div>
        <div class="px-4 py-3 max-h-[38vh] overflow-y-auto">
          ${state.cart.length ? state.cart.map(CartRow).join('') : `<div class="text-center text-xs py-6" style="color:var(--ink-600)">Keranjang masih kosong.<br>Klik barang di kiri untuk menambah.</div>`}
        </div>
        <div class="px-4 receipt-edge"></div>
        <div class="px-4 py-3 space-y-2 font-mono text-sm">
          <div class="flex justify-between"><span>Subtotal</span><span>${rupiah(subtotal)}</span></div>
          <div class="flex justify-between items-center">
            <span>Diskon</span>
            <input id="discount-input" type="number" min="0" value="${state.discountRp}" class="w-24 text-right border rounded px-2 py-1 font-mono text-sm" style="border-color:var(--line)">
          </div>
          <div class="flex justify-between text-lg font-bold pt-1" style="color:var(--press)"><span class="font-sans">TOTAL</span><span>${rupiah(total)}</span></div>
        </div>
        <div class="px-4 pb-4 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <select id="metode-select" class="border rounded-lg px-2 py-2 text-sm" style="border-color:var(--line)">
              ${['Tunai','QRIS','Transfer','Debit/Kredit'].map(m=>`<option ${state.metode===m?'selected':''}>${m}</option>`).join('')}
            </select>
            <input id="bayar-input" type="number" min="0" placeholder="Jumlah bayar" value="${state.bayar||''}" class="border rounded-lg px-2 py-2 text-sm font-mono ${state.metode!=='Tunai'?'opacity-50 pointer-events-none':''}" style="border-color:var(--line)">
          </div>
          ${ state.metode==='Tunai' ? `<div class="flex justify-between text-sm px-1"><span style="color:var(--ink-600)">Kembalian</span><span class="font-mono font-semibold" style="color:var(--ok-green)">${rupiah(kembalian)}</span></div>` : '' }
          <button id="checkout-btn" ${(!state.cart.length || !bisaBayar)?'disabled':''} class="w-full py-3 rounded-lg font-semibold text-white text-sm disabled:opacity-40 disabled:cursor-not-allowed" style="background:var(--press)">
            Buat Invoice &amp; Bayar
          </button>
          ${state.cart.length? `<button id="clear-cart-btn" class="w-full py-2 rounded-lg text-xs font-medium" style="color:var(--stamp-red)">Kosongkan keranjang</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function ProductCard(p){
  return `
  <div class="prod-card bg-white rounded-lg border p-3 flex flex-col justify-between" style="border-color:var(--line)">
    <div>
      <div class="text-[10px] font-mono" style="color:var(--ink-600)">${p.kode}</div>
      <div class="text-sm font-semibold leading-snug mt-0.5">${p.nama}</div>
      <div class="text-[10px] mt-1 inline-block px-1.5 py-0.5 rounded" style="background:var(--press-50);color:var(--press)">${p.kategori||'-'}</div>
    </div>
    <div class="flex items-center justify-between mt-3">
      <div>
        <div class="font-mono font-bold text-sm" style="color:var(--press)">${rupiah(p.harga)}</div>
        <div class="text-[10px]" style="color:var(--ink-600)">/${p.satuan||'unit'}</div>
      </div>
      <button data-add="${p.kode}" class="w-8 h-8 rounded-full text-white text-lg font-bold flex items-center justify-center" style="background:var(--press)">+</button>
    </div>
  </div>`;
}

function CartRow(item){
  return `
  <div class="flex items-center gap-2 py-1.5">
    <div class="flex-1 min-w-0">
      <div class="text-xs font-medium truncate">${item.nama}</div>
      <div class="text-[10px] font-mono" style="color:var(--ink-600)">${rupiah(item.harga)} × ${item.qty}</div>
    </div>
    <div class="flex items-center gap-1">
      <span data-qty-dec="${item.kode}" class="qstep-btn">−</span>
      <span class="w-5 text-center text-xs font-mono">${item.qty}</span>
      <span data-qty-inc="${item.kode}" class="qstep-btn">+</span>
    </div>
    <div class="w-16 text-right text-xs font-mono font-semibold">${rupiah(item.harga*item.qty)}</div>
    <span data-remove="${item.kode}" class="text-xs cursor-pointer px-1" style="color:var(--stamp-red)">✕</span>
  </div>`;
}

/* ---------- DATA BARANG ---------- */
function ViewBarang(){
  const editing = state.editingKode ? state.products.find(p=>p.kode===state.editingKode) : null;
  return `
  <div class="pt-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl border p-4" style="border-color:var(--line)">
        <div class="flex items-center gap-2 mb-3">
          ${regMark(18,'var(--press)')}
          <h2 class="font-display text-lg">${editing? 'EDIT BARANG' : 'TAMBAH BARANG'}</h2>
        </div>
        <form id="product-form" class="space-y-3">
          <div>
            <label class="text-xs font-medium" style="color:var(--ink-600)">Kode Barang</label>
            <input name="kode" required ${editing?'readonly':''} value="${editing?editing.kode:''}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 ${editing?'bg-gray-100':''}" style="border-color:var(--line)" placeholder="cth. PC011">
          </div>
          <div>
            <label class="text-xs font-medium" style="color:var(--ink-600)">Nama Barang / Jasa</label>
            <input name="nama" required value="${editing?editing.nama:''}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)" placeholder="cth. Cetak Kalender">
          </div>
          <div>
            <label class="text-xs font-medium" style="color:var(--ink-600)">Kategori</label>
            <input name="kategori" list="kategori-list" value="${editing?editing.kategori:''}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)" placeholder="Pilih atau ketik baru">
            <datalist id="kategori-list">${KATEGORI_SARAN.map(k=>`<option value="${k}">`).join('')}</datalist>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-medium" style="color:var(--ink-600)">Harga (Rp)</label>
              <input name="harga" type="number" min="0" required value="${editing?editing.harga:''}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 font-mono" style="border-color:var(--line)">
            </div>
            <div>
              <label class="text-xs font-medium" style="color:var(--ink-600)">Satuan</label>
              <input name="satuan" value="${editing?editing.satuan:''}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)" placeholder="lembar/meter/pcs">
            </div>
          </div>
          <div class="flex gap-2 pt-1">
            <button type="submit" class="flex-1 py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--press)">${editing?'Simpan Perubahan':'Tambah Barang'}</button>
            ${editing?`<button type="button" id="cancel-edit" class="px-4 py-2.5 rounded-lg text-sm font-medium border" style="border-color:var(--line)">Batal</button>`:''}
          </div>
        </form>
      </div>
      ${!state.settings.webAppUrl ? `<div class="mt-3 text-xs rounded-lg p-3" style="background:var(--stamp-red-50);color:var(--stamp-red)">Belum tersambung ke Spreadsheet — perubahan hanya tersimpan lokal. Atur di tab <b>Pengaturan</b>.</div>` : ''}
    </div>

    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl border overflow-hidden" style="border-color:var(--line)">
        <div class="px-4 py-3 flex items-center justify-between receipt-edge">
          <h2 class="font-display text-lg">DAFTAR BARANG <span class="text-sm font-sans font-normal" style="color:var(--ink-600)">(${state.products.length})</span></h2>
          <button id="reload-products" class="text-xs px-3 py-1.5 rounded-lg border font-medium" style="border-color:var(--line)">↻ Muat ulang</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs" style="color:var(--ink-600)">
              <th class="px-4 py-2 font-medium">Kode</th><th class="px-2 py-2 font-medium">Nama</th>
              <th class="px-2 py-2 font-medium">Kategori</th><th class="px-2 py-2 font-medium text-right">Harga</th>
              <th class="px-2 py-2 font-medium">Satuan</th><th class="px-4 py-2 font-medium text-right">Aksi</th>
            </tr></thead>
            <tbody>
              ${state.products.map(p=>`
              <tr class="border-t" style="border-color:var(--line)">
                <td class="px-4 py-2 font-mono text-xs">${p.kode}</td>
                <td class="px-2 py-2 font-medium">${p.nama}</td>
                <td class="px-2 py-2"><span class="text-[10px] px-1.5 py-0.5 rounded" style="background:var(--press-50);color:var(--press)">${p.kategori||'-'}</span></td>
                <td class="px-2 py-2 text-right font-mono">${rupiah(p.harga)}</td>
                <td class="px-2 py-2" style="color:var(--ink-600)">${p.satuan||'-'}</td>
                <td class="px-4 py-2 text-right whitespace-nowrap">
                  <button data-edit="${p.kode}" class="text-xs font-medium mr-3" style="color:var(--press)">Ubah</button>
                  <button data-delete="${p.kode}" class="text-xs font-medium" style="color:var(--stamp-red)">Hapus</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- RIWAYAT ---------- */
function ViewRiwayat(){
  return `
  <div class="pt-4">
    <div class="bg-white rounded-xl border overflow-hidden" style="border-color:var(--line)">
      <div class="px-4 py-3 flex items-center justify-between receipt-edge">
        <h2 class="font-display text-lg">RIWAYAT TRANSAKSI</h2>
        <button id="load-history" class="text-xs px-3 py-1.5 rounded-lg border font-medium" style="border-color:var(--line)">↻ Muat dari Spreadsheet</button>
      </div>
      ${!state.settings.webAppUrl ? `<div class="p-6 text-sm text-center" style="color:var(--ink-600)">Sambungkan ke Spreadsheet di tab <b>Pengaturan</b> untuk melihat riwayat transaksi.</div>` :
      (state.transactions.length ? `
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-xs" style="color:var(--ink-600)">
            <th class="px-4 py-2 font-medium">No. Invoice</th><th class="px-2 py-2 font-medium">Tanggal</th>
            <th class="px-2 py-2 font-medium">Kasir</th><th class="px-2 py-2 font-medium">Metode</th>
            <th class="px-4 py-2 font-medium text-right">Total</th>
          </tr></thead>
          <tbody>
            ${state.transactions.map(t=>`
            <tr class="border-t" style="border-color:var(--line)">
              <td class="px-4 py-2 font-mono text-xs">${t.invoiceNo}</td>
              <td class="px-2 py-2 text-xs">${t.tanggal}</td>
              <td class="px-2 py-2">${t.kasir}</td>
              <td class="px-2 py-2">${t.metode}</td>
              <td class="px-4 py-2 text-right font-mono font-semibold">${rupiah(t.total)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="p-6 text-sm text-center" style="color:var(--ink-600)">Belum ada transaksi. Klik "Muat dari Spreadsheet".</div>`)}
    </div>
  </div>`;
}

/* ---------- PENGATURAN ---------- */
function ViewPengaturan(){
  const s = state.settings;
  return `
  <div class="pt-4 max-w-xl">
    <div class="bg-white rounded-xl border p-5" style="border-color:var(--line)">
      <div class="flex items-center gap-2 mb-4">${regMark(18,'var(--press)')}<h2 class="font-display text-lg">PENGATURAN</h2></div>
      <form id="settings-form" class="space-y-3">
        <div>
          <label class="text-xs font-medium" style="color:var(--ink-600)">URL Web App Google Apps Script</label>
          <input name="webAppUrl" value="${s.webAppUrl}" placeholder="https://script.google.com/macros/s/…/exec" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 font-mono" style="border-color:var(--line)">
          <p class="text-[11px] mt-1" style="color:var(--ink-600)">Lihat panduan pemasangan di file PANDUAN-SETUP.md</p>
        </div>
        <div>
          <label class="text-xs font-medium" style="color:var(--ink-600)">Nama Toko</label>
          <input name="storeName" value="${s.storeName}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-medium" style="color:var(--ink-600)">Alamat / No. WhatsApp (tampil di nota)</label>
          <input name="address" value="${s.address}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-medium" style="color:var(--ink-600)">Nama Kasir Aktif</label>
          <input name="cashier" value="${s.cashier}" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-medium" style="color:var(--ink-600)">Catatan Kaki Nota</label>
          <textarea name="footer" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">${s.footer}</textarea>
        </div>
        <div class="flex gap-2 pt-1">
          <button type="submit" class="flex-1 py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--press)">Simpan Pengaturan</button>
          <button type="button" id="test-connection" class="px-4 py-2.5 rounded-lg text-sm font-medium border" style="border-color:var(--line)">Tes Koneksi</button>
        </div>
        <div id="test-result" class="text-xs"></div>
      </form>
    </div>
  </div>`;
}

/* ---------- INVOICE MODAL ---------- */
function InvoiceModal(){
  const t = state.lastInvoice;
  return `
  <div class="fixed inset-0 modal-bg z-40 flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-xl max-w-sm w-full max-h-[90vh] overflow-y-auto fade-in">
      <div id="invoice-print-area" class="p-5 font-mono text-xs">
        <div class="text-center mb-3">
          <div class="font-display text-lg font-sans" style="font-family:'Big Shoulders Display'">${state.settings.storeName.toUpperCase()}</div>
          <div style="color:var(--ink-600)">${state.settings.address||''}</div>
        </div>
        <div class="dashed-x my-2"></div>
        <div class="flex justify-between"><span>No. Invoice</span><span>${t.invoiceNo}</span></div>
        <div class="flex justify-between"><span>Tanggal</span><span>${t.tanggal}</span></div>
        <div class="flex justify-between"><span>Kasir</span><span>${t.kasir}</span></div>
        <div class="dashed-x my-2"></div>
        ${t.items.map(i=>`
          <div class="mb-1">
            <div>${i.nama}</div>
            <div class="flex justify-between" style="color:var(--ink-600)"><span>${i.qty} x ${rupiah(i.harga)}</span><span>${rupiah(i.subtotal)}</span></div>
          </div>`).join('')}
        <div class="dashed-x my-2"></div>
        <div class="flex justify-between"><span>Subtotal</span><span>${rupiah(t.subtotal)}</span></div>
        ${t.diskon? `<div class="flex justify-between"><span>Diskon</span><span>-${rupiah(t.diskon)}</span></div>`:''}
        <div class="flex justify-between font-bold text-sm mt-1"><span>TOTAL</span><span>${rupiah(t.total)}</span></div>
        <div class="flex justify-between mt-1"><span>${t.metode}</span><span>${rupiah(t.bayar)}</span></div>
        ${t.metode==='Tunai'?`<div class="flex justify-between"><span>Kembali</span><span>${rupiah(t.kembalian)}</span></div>`:''}
        <div class="dashed-x my-3"></div>
        <div class="text-center" style="color:var(--ink-600)">${state.settings.footer}</div>
        <div class="flex justify-center mt-2">${regMark(24,'var(--press)')}</div>
      </div>
      <div class="p-4 pt-0 flex gap-2 no-print">
        <button id="print-invoice" class="flex-1 py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--press)">Cetak</button>
        <button id="close-invoice" class="px-4 py-2.5 rounded-lg text-sm font-medium border" style="border-color:var(--line)">Transaksi Baru</button>
      </div>
      ${ t.syncWarning ? `<div class="mx-4 mb-4 text-[11px] p-2 rounded" style="background:var(--stamp-red-50);color:var(--stamp-red)">${t.syncWarning}</div>` : '' }
    </div>
  </div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ state.view = el.dataset.tab; state.editingKode=null; render(); if(state.view==='riwayat' && state.settings.webAppUrl && !state.transactions.length) loadHistory(); });

  // Kasir
  const searchInput = document.getElementById('search-input');
  if(searchInput) searchInput.oninput = e=>{ state.search = e.target.value; render(); document.getElementById('search-input').focus(); document.getElementById('search-input').setSelectionRange(state.search.length,state.search.length); };
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{ state.category = el.dataset.cat; render(); });
  document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>addToCart(el.dataset.add));
  document.querySelectorAll('[data-qty-inc]').forEach(el=>el.onclick=()=>changeQty(el.dataset.qtyInc,1));
  document.querySelectorAll('[data-qty-dec]').forEach(el=>el.onclick=()=>changeQty(el.dataset.qtyDec,-1));
  document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{ state.cart = state.cart.filter(i=>i.kode!==el.dataset.remove); render(); });
  const discountInput = document.getElementById('discount-input');
  if(discountInput) discountInput.oninput = e=>{ state.discountRp = Number(e.target.value)||0; render(); };
  const metodeSelect = document.getElementById('metode-select');
  if(metodeSelect) metodeSelect.onchange = e=>{ state.metode = e.target.value; render(); };
  const bayarInput = document.getElementById('bayar-input');
  if(bayarInput) bayarInput.oninput = e=>{ state.bayar = Number(e.target.value)||0; render(); };
  const checkoutBtn = document.getElementById('checkout-btn');
  if(checkoutBtn) checkoutBtn.onclick = checkout;
  const clearCartBtn = document.getElementById('clear-cart-btn');
  if(clearCartBtn) clearCartBtn.onclick = ()=>{ state.cart=[]; render(); };

  // Barang
  const productForm = document.getElementById('product-form');
  if(productForm) productForm.onsubmit = saveProduct;
  const cancelEdit = document.getElementById('cancel-edit');
  if(cancelEdit) cancelEdit.onclick = ()=>{ state.editingKode=null; render(); };
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{ state.editingKode = el.dataset.edit; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>deleteProduct(el.dataset.delete));
  const reloadBtn = document.getElementById('reload-products');
  if(reloadBtn) reloadBtn.onclick = ()=>syncProductsFromSheet(false);

  // Riwayat
  const loadHistoryBtn = document.getElementById('load-history');
  if(loadHistoryBtn) loadHistoryBtn.onclick = loadHistory;

  // Pengaturan
  const settingsForm = document.getElementById('settings-form');
  if(settingsForm) settingsForm.onsubmit = saveSettings;
  const testBtn = document.getElementById('test-connection');
  if(testBtn) testBtn.onclick = testConnection;

  // Invoice modal
  const printBtn = document.getElementById('print-invoice');
  if(printBtn) printBtn.onclick = ()=>window.print();
  const closeBtn = document.getElementById('close-invoice');
  if(closeBtn) closeBtn.onclick = ()=>{ state.lastInvoice=null; state.bayar=0; state.discountRp=0; render(); };
}

function addToCart(kode){
  const p = state.products.find(p=>p.kode===kode); if(!p) return;
  const existing = state.cart.find(i=>i.kode===kode);
  if(existing) existing.qty += 1; else state.cart.push({...p, qty:1});
  render();
}
function changeQty(kode, delta){
  const item = state.cart.find(i=>i.kode===kode); if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.cart = state.cart.filter(i=>i.kode!==kode);
  render();
}

async function checkout(){
  const subtotal = state.cart.reduce((s,i)=>s+i.harga*i.qty,0);
  const diskon = Number(state.discountRp)||0;
  const total = Math.max(subtotal-diskon,0);
  const bayar = state.metode==='Tunai' ? (Number(state.bayar)||0) : total;
  const kembalian = state.metode==='Tunai' ? Math.max(bayar-total,0) : 0;
  const invoiceNo = await nextInvoiceNo();

  const trx = {
    invoiceNo, tanggal: todayLabel(), kasir: state.settings.cashier,
    metode: state.metode, items: state.cart.map(i=>({kode:i.kode,nama:i.nama,qty:i.qty,harga:i.harga,subtotal:i.harga*i.qty})),
    subtotal, diskon, total, bayar, kembalian
  };

  if(state.settings.webAppUrl){
    try{ await apiPost('saveTransaction', trx); }
    catch(e){ trx.syncWarning = 'Nota tersimpan, namun gagal sinkron ke Spreadsheet: ' + e.message; }
  } else {
    trx.syncWarning = 'Belum tersambung ke Spreadsheet — transaksi ini hanya tercatat di nota, tidak tersimpan permanen.';
  }

  state.lastInvoice = trx;
  state.cart = [];
  render();
}

async function saveProduct(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const p = { kode: fd.get('kode').trim(), nama: fd.get('nama').trim(), kategori: fd.get('kategori').trim()||'Lainnya', harga: Number(fd.get('harga'))||0, satuan: fd.get('satuan').trim()||'unit' };
  const isEdit = !!state.editingKode;

  if(isEdit){ const idx = state.products.findIndex(x=>x.kode===p.kode); if(idx>-1) state.products[idx]=p; }
  else {
    if(state.products.some(x=>x.kode===p.kode)){ alert('Kode barang sudah dipakai.'); return; }
    state.products.push(p);
  }
  await store.set('icahprint:products', JSON.stringify(state.products));
  state.editingKode = null;
  render();

  if(state.settings.webAppUrl){
    try{ await apiPost(isEdit?'updateProduct':'addProduct', p); }
    catch(e){ console.warn('Gagal sinkron produk', e); }
  }
}

async function deleteProduct(kode){
  if(!confirm('Hapus barang ini?')) return;
  state.products = state.products.filter(p=>p.kode!==kode);
  await store.set('icahprint:products', JSON.stringify(state.products));
  render();
  if(state.settings.webAppUrl){ try{ await apiPost('deleteProduct',{kode}); }catch(e){ console.warn(e); } }
}

async function loadHistory(){
  if(!state.settings.webAppUrl) return;
  try{ state.transactions = await apiGet('getTransactions'); }catch(e){ alert('Gagal memuat riwayat: '+e.message); }
  render();
}

async function saveSettings(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  state.settings = { webAppUrl: fd.get('webAppUrl').trim(), storeName: fd.get('storeName').trim()||'Icah Print', address: fd.get('address').trim(), cashier: fd.get('cashier').trim()||'Kasir', footer: fd.get('footer').trim() };
  await store.set('icahprint:settings', JSON.stringify(state.settings));
  if(state.settings.webAppUrl) syncProductsFromSheet(false); else render();
}

async function testConnection(){
  const box = document.getElementById('test-result');
  box.innerHTML = `<span style="color:var(--ink-600)">Menguji koneksi…</span>`;
  const url = document.querySelector('[name="webAppUrl"]').value.trim();
  if(!url){ box.innerHTML = `<span style="color:var(--stamp-red)">Isi URL Web App terlebih dahulu.</span>`; return; }
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + 'action=ping');
    const json = await res.json();
    if(json.success) box.innerHTML = `<span style="color:var(--ok-green)">✓ ${json.message}</span>`;
    else box.innerHTML = `<span style="color:var(--stamp-red)">Gagal: ${json.error}</span>`;
  }catch(e){ box.innerHTML = `<span style="color:var(--stamp-red)">Gagal terhubung: ${e.message}</span>`; }
}

init();
</script>
</body>
</html>
